name: Deploy Landing Page on Direct Push

on:
  push:
    branches: ["main"]
    paths:
      - 'landing/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inject pyproject.toml Version into Landing Page & Sitemap
        run: |
          python - << 'EOF'
          import re, tomllib, datetime

          # 1. Read version from pyproject.toml
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
              version = data.get("project", {}).get("version")
              if not version:
                  version = data.get("tool", {}).get("poetry", {}).get("version")

          if not version:
              raise ValueError("Could not extract version from pyproject.toml")

          print(f" Extracted version from pyproject.toml: {version}")

          # 2. Update softwareVersion in landing/index.html
          with open("landing/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          html_updated = re.sub(
              r'("softwareVersion":\s*")[^"]+(")',
              rf'\g<1>{version}\g<2>',
              html
          )

          with open("landing/index.html", "w", encoding="utf-8") as f:
              f.write(html_updated)

          print(f" Updated softwareVersion to {version} in landing/index.html")

          # 3. Update <lastmod> in landing/sitemap.xml
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          try:
              with open("landing/sitemap.xml", "r", encoding="utf-8") as f:
                  sitemap = f.read()

              sitemap_updated = re.sub(
                  r'(<lastmod>)[^<]+(</lastmod>)',
                  rf'\g<1>{today}\g<2>',
                  sitemap
              )

              with open("landing/sitemap.xml", "w", encoding="utf-8") as f:
                  f.write(sitemap_updated)

              print(f" Updated sitemap <lastmod> to {today} in landing/sitemap.xml")
          except FileNotFoundError:
              print("ℹ️ landing/sitemap.xml not found, skipping sitemap update.")

          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'landing'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
