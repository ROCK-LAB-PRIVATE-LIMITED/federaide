name: Deploy Landing Page on Direct Push

on:
  push:
    branches: ["main"]
    paths:
      - 'landing/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'landing'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
