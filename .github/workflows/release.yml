name: Build and Publish Release

on:
  push:
    branches:
      - main
      - Dev
    paths:
      - 'pyproject.toml'

jobs:
  check_version:
    name: Detect Version & Create Tag
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      pkg_name: ${{ steps.check.outputs.pkg_name }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches HEAD and HEAD~1

      - name: Check for Version Bump & Target Branch
        id: check
        run: |
          python - << 'EOF'
          import subprocess, tomllib, os

          def get_project_data(ref):
              try:
                  content = subprocess.check_output(
                      ["git", "show", f"{ref}:pyproject.toml"],
                      text=True,
                      stderr=subprocess.DEVNULL
                  )
                  return tomllib.loads(content)
              except Exception:
                  return {}

          curr_data = get_project_data("HEAD")
          prev_data = get_project_data("HEAD~1")

          curr = curr_data.get("project", {}).get("version") or curr_data.get("tool", {}).get("poetry", {}).get("version")
          prev = prev_data.get("project", {}).get("version") or prev_data.get("tool", {}).get("poetry", {}).get("version")

          print(f"Previous version (HEAD~1): {prev}")
          print(f"Current version  (HEAD)  : {curr}")

          ref_name = "${{ github.ref_name }}"
          is_dispatch = "${{ github.event_name }}" == "workflow_dispatch"

          # Determine Package Name and Tag format based on branch
          if ref_name == "Dev":
              pkg_name = "federaide-dev-nightly"
              tag_suffix = "-dev"
          else:
              pkg_name = curr_data.get("project", {}).get("name") or curr_data.get("tool", {}).get("poetry", {}).get("name") or "federaide"
              tag_suffix = ""

          if curr and (curr != prev or is_dispatch):
              tag = f"v{curr}{tag_suffix}"
              print(f"🎉 New release detected on branch [{ref_name}]: {tag} (Package: {pkg_name})")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"bumped=true\n")
                  f.write(f"version={curr}\n")
                  f.write(f"tag_name={tag}\n")
                  f.write(f"pkg_name={pkg_name}\n")
          else:
              print("ℹ️ Version did not change. Skipping build.")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"bumped=false\n")
          EOF

      - name: Create and Push Git Tag
        if: steps.check.outputs.bumped == 'true'
        env:
          TAG_NAME: ${{ steps.check.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            echo "Creating and pushing git tag: ${TAG_NAME}"
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}"
          else
            echo "Tag ${TAG_NAME} already exists on remote."
          fi

  build_wheels:
    needs: check_version
    if: needs.check_version.outputs.bumped == 'true'
    name: Build Wheel for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Native (x86_64)
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            plat_name: win_amd64
            suffix: .exe
            
          # macOS Intel Native
          - target: macos-x86_64
            os: macos-15-intel
            goos: darwin
            goarch: amd64
            plat_name: macosx_10_9_x86_64
            suffix: ""
            
          # macOS Apple Silicon Native
          - target: macos-arm64
            os: macos-14
            goos: darwin
            goarch: arm64
            plat_name: macosx_11_0_arm64
            suffix: ""
            
          # Linux Native (x86_64)
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            plat_name: manylinux2014_x86_64
            suffix: ""

          # Raspberry Pi 64-bit (Modern Pi 3/4/5)
          - target: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            plat_name: manylinux2014_aarch64
            cc: aarch64-linux-gnu-gcc
            cc_pkg: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            suffix: ""
            
          # Android/Termux (ARM64) via NDK Cross-Compilation
          - target: android-arm64
            os: ubuntu-latest
            goos: android
            goarch: arm64
            plat_name: android_24_arm64_v8a 
            suffix: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Package Name in pyproject.toml
        run: |
          python - << 'EOF'
          import re
          pkg_name = "${{ needs.check_version.outputs.pkg_name }}"
          with open("pyproject.toml", "r", encoding="utf-8") as f:
              content = f.read()

          updated = re.sub(
              r'^(name\s*=\s*")[^"]+(")',
              rf'\g<1>{pkg_name}\g<2>',
              content,
              flags=re.MULTILINE
          )

          with open("pyproject.toml", "w", encoding="utf-8") as f:
              f.write(updated)

          print(f"Set package name in pyproject.toml to: {pkg_name}")
          EOF

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      # --- Setup Android NDK (Only for Android Target) ---
      - name: Setup Android NDK
        if: matrix.goos == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install Linux Cross-Compilers
        if: matrix.cc_pkg != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cc_pkg }}

      # --- Build Desktop / Standard Linux Binaries ---
      - name: Compile Go Sidecars (Desktop)
        if: matrix.goos != 'android'
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC=${{ matrix.cc }}
          fi
          mkdir -p src/federate/bin
          cd go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_bridge${{ matrix.suffix }} ./cmd/bridge/main.go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_embed${{ matrix.suffix }} ./cmd/embed/main.go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_search${{ matrix.suffix }} ./cmd/search/main.go

      # --- Build Android Termux Binaries via NDK ---
      - name: Compile Go Sidecars (Android)
        if: matrix.goos == 'android'
        env:
          CGO_ENABLED: 1
          GOOS: android
          GOARCH: arm64
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
        run: |
          mkdir -p src/federate/bin
          cd go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_bridge ./cmd/bridge/main.go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_embed ./cmd/embed/main.go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_search ./cmd/search/main.go

      - name: Build Platform Wheel
        run: |
          python -m build --wheel --config-setting=--build-option=--plat-name=${{ matrix.plat_name }}

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  build_sdist:
    name: Build Source Distribution
    needs: check_version
    if: needs.check_version.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Package Name in pyproject.toml
        run: |
          python - << 'EOF'
          import re
          pkg_name = "${{ needs.check_version.outputs.pkg_name }}"
          with open("pyproject.toml", "r", encoding="utf-8") as f:
              content = f.read()

          updated = re.sub(
              r'^(name\s*=\s*")[^"]+(")',
              rf'\g<1>{pkg_name}\g<2>',
              content,
              flags=re.MULTILINE
          )

          with open("pyproject.toml", "w", encoding="utf-8") as f:
              f.write(updated)

          print(f"Set package name in pyproject.toml to: {pkg_name}")
          EOF

      - name: Install Build Dependencies
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish Release to PyPI
    environment: pypi
    needs: [check_version, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: needs.check_version.outputs.bumped == 'true'
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check_version.outputs.tag_name }}
          files: dist/*
          body: ${{ github.event.head_commit.message }}
          generate_release_notes: true

  deploy_landing:
    name: Update & Deploy Landing Page
    needs: [check_version, publish]
    runs-on: ubuntu-latest
    # Only run for main branch release
    if: needs.check_version.outputs.bumped == 'true' && github.ref_name == 'main'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inject pyproject.toml Version into Landing Page & Sitemap
        run: |
          python - << 'EOF'
          import re, tomllib, datetime

          # 1. Read version from pyproject.toml
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
              version = data.get("project", {}).get("version") or data.get("tool", {}).get("poetry", {}).get("version")

          if not version:
              raise ValueError("Could not extract version from pyproject.toml")

          print(f"Extracted version from pyproject.toml: {version}")

          # 2. Update softwareVersion in landing/index.html
          with open("landing/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          html_updated = re.sub(
              r'("softwareVersion":\s*")[^"]+(")',
              rf'\g<1>{version}\g<2>',
              html
          )

          with open("landing/index.html", "w", encoding="utf-8") as f:
              f.write(html_updated)

          print(f"Updated softwareVersion to {version} in landing/index.html")

          # 3. Update <lastmod> in landing/sitemap.xml
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          try:
              with open("landing/sitemap.xml", "r", encoding="utf-8") as f:
                  sitemap = f.read()

              sitemap_updated = re.sub(
                  r'(<lastmod>)[^<]+(</lastmod>)',
                  rf'\g<1>{today}\g<2>',
                  sitemap
              )

              with open("landing/sitemap.xml", "w", encoding="utf-8") as f:
                  f.write(sitemap_updated)

              print(f"Updated sitemap <lastmod> to {today} in landing/sitemap.xml")
          except FileNotFoundError:
              print("ℹ️ landing/sitemap.xml not found, skipping sitemap update.")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'landing'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
