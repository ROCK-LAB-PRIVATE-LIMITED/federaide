name: Build and Publish Dev Nightly Wheels

on:
  push:
    branches:
      - Dev
    paths:
      - 'pyproject.toml'

jobs:
  check_version:
    name: Detect Version & Create Tag
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches HEAD and HEAD~1

      - name: Check for Version Bump
        id: check
        run: |
          python - << 'EOF'
          import subprocess, tomllib, os

          def get_version(ref):
              try:
                  content = subprocess.check_output(
                      ["git", "show", f"{ref}:pyproject.toml"],
                      text=True,
                      stderr=subprocess.DEVNULL
                  )
                  data = tomllib.loads(content)
                  return data.get("project", {}).get("version") or data.get("tool", {}).get("poetry", {}).get("version")
              except Exception:
                  return None

          curr = get_version("HEAD")
          prev = get_version("HEAD~1")

          print(f"Previous version (HEAD~1): {prev}")
          print(f"Current version  (HEAD)  : {curr}")

          is_dispatch = "${{ github.event_name }}" == "workflow_dispatch"

          if curr and (curr != prev or is_dispatch):
              tag = f"v{curr}-dev"
              print(f"🎉 New dev release detected: {tag}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"bumped=true\n")
                  f.write(f"version={curr}\n")
                  f.write(f"tag_name={tag}\n")
          else:
              print("ℹ️ Version did not change. Skipping build.")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"bumped=false\n")
          EOF

      - name: Create and Push Git Tag
        if: steps.check.outputs.bumped == 'true'
        env:
          TAG_NAME: ${{ steps.check.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            echo "Creating and pushing git tag: ${TAG_NAME}"
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}"
          else
            echo "Tag ${TAG_NAME} already exists on remote."
          fi

  build_wheels:
    needs: check_version
    if: needs.check_version.outputs.bumped == 'true'
    name: Build Wheel for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Native (x86_64)
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            plat_name: win_amd64
            suffix: .exe
            
          # macOS Intel Native
          - target: macos-x86_64
            os: macos-15-intel
            goos: darwin
            goarch: amd64
            plat_name: macosx_10_9_x86_64
            suffix: ""
            
          # macOS Apple Silicon Native
          - target: macos-arm64
            os: macos-14
            goos: darwin
            goarch: arm64
            plat_name: macosx_11_0_arm64
            suffix: ""
            
          # Linux Native (x86_64)
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            plat_name: manylinux2014_x86_64
            suffix: ""

          # Raspberry Pi 64-bit (Modern Pi 3/4/5)
          - target: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            plat_name: manylinux2014_aarch64
            cc: aarch64-linux-gnu-gcc
            cc_pkg: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            suffix: ""
            
          # Android/Termux (ARM64) via NDK Cross-Compilation
          - target: android-arm64
            os: ubuntu-latest
            goos: android
            goarch: arm64
            plat_name: android_24_arm64_v8a 
            suffix: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch Package Name to federaide-dev-nightly
        run: |
          python - << 'EOF'
          import re
          with open("pyproject.toml", "r", encoding="utf-8") as f:
              content = f.read()

          updated = re.sub(
              r'^(name\s*=\s*")[^"]+(")',
              r'\g<1>federaide-dev-nightly\g<2>',
              content,
              flags=re.MULTILINE
          )

          with open("pyproject.toml", "w", encoding="utf-8") as f:
              f.write(updated)

          print("Updated package name in pyproject.toml to federaide-dev-nightly")
          EOF

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      # --- Setup Android NDK (Only for Android Target) ---
      - name: Setup Android NDK
        if: matrix.goos == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install Linux Cross-Compilers
        if: matrix.cc_pkg != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cc_pkg }}

      # --- Build Desktop / Standard Linux Binaries ---
      - name: Compile Go Sidecars (Desktop)
        if: matrix.goos != 'android'
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC=${{ matrix.cc }}
          fi
          mkdir -p src/federate/bin
          cd go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_bridge${{ matrix.suffix }} ./cmd/bridge/main.go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_embed${{ matrix.suffix }} ./cmd/embed/main.go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_search${{ matrix.suffix }} ./cmd/search/main.go

      # --- Build Android Termux Binaries via NDK ---
      - name: Compile Go Sidecars (Android)
        if: matrix.goos == 'android'
        env:
          CGO_ENABLED: 1
          GOOS: android
          GOARCH: arm64
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
        run: |
          mkdir -p src/federate/bin
          cd go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_bridge ./cmd/bridge/main.go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_embed ./cmd/embed/main.go
          go build -ldflags="-s -w" -o ../src/federate/bin/federate_search ./cmd/search/main.go

      - name: Build Platform Wheel
        run: |
          python -m build --wheel --config-setting=--build-option=--plat-name=${{ matrix.plat_name }}

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  build_sdist:
    name: Build Source Distribution
    needs: check_version
    if: needs.check_version.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch Package Name to federaide-dev-nightly
        run: |
          python - << 'EOF'
          import re
          with open("pyproject.toml", "r", encoding="utf-8") as f:
              content = f.read()

          updated = re.sub(
              r'^(name\s*=\s*")[^"]+(")',
              r'\g<1>federaide-dev-nightly\g<2>',
              content,
              flags=re.MULTILINE
          )

          with open("pyproject.toml", "w", encoding="utf-8") as f:
              f.write(updated)

          print("Updated package name in pyproject.toml to federaide-dev-nightly")
          EOF

      - name: Install Build Dependencies
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish Release to PyPI
    environment: pypi
    needs: [check_version, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: needs.check_version.outputs.bumped == 'true'
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check_version.outputs.tag_name }}
          files: dist/*
          body: ${{ github.event.head_commit.message }}
          generate_release_notes: true
